name: probe-runner-limit

# TEMPORARY diagnostic (delete after use). Answers one question: are long jobs on
# this repo killed by a wall-clock cap, or does build-tflite die from memory?
# If this probe is cancelled around 7-8 minutes, the cap is account-level and the
# conversion failing at ~7m35s is not the converter's fault.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: host resources
        run: |
          nproc
          free -h
          df -h /
          ulimit -a

      - name: sleep 12 minutes
        run: |
          for i in $(seq 1 12); do echo "tick $i $(date -u +%H:%M:%S)"; sleep 60; done
          echo "survived 12 minutes"
