name: build-tflite-artifact

# Runs the TFLite conversion that cannot run on the macOS dev host (tensorflow and
# onnx cannot coexist in one process there — see docs/phase0-results.md §3b).
# Outputs the fp32 and full-integer INT8 artifacts plus their manifest; scoring
# against the eval set happens locally, because the eval images are not in the repo.

on:
  workflow_dispatch:
    inputs:
      resolution:
        description: "input resolution"
        default: "224"
  push:
    paths:
      - "ml/export/**"
      - ".github/workflows/build-tflite.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU toolchain
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          # Pinned: onnx2tf's resolver backtracks to 1.28.8 against TF 2.21 anyway.
          # 1.28.8 declares no dependencies of its own but imports all of these at
          # module scope (checked against the wheel), so they are listed explicitly.
          pip install "tensorflow-cpu==2.21.0" "onnx2tf==1.28.8" "tf-keras==2.21.0" \
            onnx-graphsurgeon sng4onnx ai-edge-litert psutil requests flatbuffers \
            open_clip_torch onnx pillow numpy huggingface_hub
          pip freeze > /tmp/pip-freeze.txt && grep -iE "tensorflow|onnx2tf|keras|graphsurgeon|onnx==" /tmp/pip-freeze.txt

      - name: Export ONNX + text embeddings
        env:
          HF_HOME: ${{ github.workspace }}/.hf
        run: |
          python ml/export/export_vision_tower.py \
            --resolution ${{ github.event.inputs.resolution || '224' }} \
            --out-dir data/eval/artifacts

      - name: Convert to TFLite (fp32 + INT8)
        run: |
          python ml/export/build_tflite_linux.py \
            --onnx data/eval/artifacts/vision_tower_224.onnx \
            --calibration ml/export/calibration_manifest.csv \
            --out-dir data/eval/artifacts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bioclip-vitb16-224-tflite
          if-no-files-found: warn
          path: |
            data/eval/artifacts/*.tflite
            data/eval/artifacts/tflite_manifest.json
            data/eval/artifacts/prompts.json
            data/eval/artifacts/export_manifest.json
            data/eval/artifacts/text_embeddings_200.npz

      # Runs after the upload on purpose: a failing smoke test must still leave the
      # artifacts behind, because the next debugging step happens against the real
      # file rather than another 25-minute rebuild.
      - name: Smoke-test the artifacts
        run: |
          python - <<'PY'
          import json, os, sys, numpy as np, tensorflow as tf
          m = json.load(open("data/eval/artifacts/tflite_manifest.json"))
          rng = np.random.default_rng(0)
          failed = []
          for key in ("fp32", "int8"):
              p = m[key]["path"]
              size_mb = os.path.getsize(p) / 1e6
              interp = tf.lite.Interpreter(model_path=p)
              interp.allocate_tensors()
              inp = interp.get_input_details()[0]
              out = interp.get_output_details()[0]
              print(key, "size", round(size_mb, 1), "MB",
                    "in", inp["shape"], inp["dtype"].__name__,
                    "out", out["shape"], out["dtype"].__name__, flush=True)
              assert out["shape"][-1] == 512, "embedding width must be 512"

              def run(x, label):
                  interp.set_tensor(inp["index"], x)
                  interp.invoke()
                  y = interp.get_tensor(out["index"])
                  ok = np.isfinite(y.astype(np.float32)).all()
                  print(f"  {key}/{label}: finite={ok} out={y.ravel()[:3]}", flush=True)
                  return ok

              # All-zero pixels are a legal photo (a black frame) and they are what
              # caught the previous 0/0 erf; a randomised frame is the happy path.
              if inp["dtype"] == np.float32:
                  zero = np.zeros(inp["shape"], dtype=np.float32)
                  rnd = rng.standard_normal(inp["shape"]).astype(np.float32)
              else:
                  qmin, qmax = -128, 127
                  zp = int(inp["quantization"][1])
                  zero = np.full(inp["shape"], zp, dtype=inp["dtype"])
                  rnd = rng.integers(qmin, qmax, size=inp["shape"]).astype(inp["dtype"])
              for x, label in ((zero, "zeros"), (rnd, "random")):
                  try:
                      if not run(x, label):
                          failed.append(f"{key}/{label}: non-finite output")
                  except Exception as e:  # noqa: BLE001
                      failed.append(f"{key}/{label}: {type(e).__name__}: {e}")
          assert os.path.getsize(m["int8"]["path"]) / 1e6 <= 120, "G7 violated"
          if failed:
              print("FAILED:", *failed, sep="\n  ", flush=True)
              sys.exit(1)
          print("smoke test OK", flush=True)
          PY
